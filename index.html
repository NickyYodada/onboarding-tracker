<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>載入中…</title>
<!-- index.html：只可修改 #appRoot 內的畫面結構；<head>、頁首、#gate、#adminOverlay 由系統使用，禁止修改。 -->
<script src="config.js"></script>
<script src="theme.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0/daisyui.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0/themes.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.0.0"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="navbar bg-base-100 shadow-sm px-4">
  <div class="flex-1"><span class="text-lg font-semibold" id="brand"></span></div>
  <div id="userbar" class="flex items-center gap-2" hidden></div>
  <div id="mwsTheme" class="flex items-center gap-1 ml-2"></div>
</header>
<main class="max-w-3xl mx-auto my-6 px-4">
  <section id="gate" class="card bg-base-100 shadow-sm max-w-md mx-auto">
    <div class="card-body">
      <h2 class="card-title text-xl">登入</h2>
      <p id="gateMsg" class="mws-note">載入中…</p>
      <div id="authRoot"></div>
      <div class="card-actions justify-end">
        <button id="gateClose" type="button" class="btn btn-ghost btn-sm" hidden>返回</button>
      </div>
      <noscript>需要啟用 JavaScript 才能使用本網站。</noscript>
    </div>
  </section>

  <!-- ═══ 擴充區開始：以下 #appRoot 內可自由修改（靜態結構寫 HTML，動態資料由 app.js 以 textContent 填入，禁止在 HTML 寫死業務資料）═══ -->
  <div id="appRoot" hidden>
    <section class="ot-page space-y-5">
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div class="space-y-1.5">
          <div class="text-xs font-bold tracking-widest uppercase text-primary" data-i18n-zh="人員準備度" data-i18n-en="PEOPLE READINESS">人員準備度</div>
          <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-base-content" data-i18n-zh="新人報到追蹤表" data-i18n-en="Onboarding tracker">新人報到追蹤表</h1>
          <p class="text-sm md:text-base text-base-content/70" data-i18n-zh="單一視圖掌握每位新進團隊成員的報到前里程碑與營運上手進度。" data-i18n-en="A single view of pre-readiness milestones and operational ramp-up for each new team member.">單一視圖掌握每位新進團隊成員的報到前里程碑與營運上手進度。</p>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
          <span id="statusText" class="text-xs font-medium text-base-content/60 px-2 py-1 rounded bg-base-100 shadow-xs">載入中…</span>
          <button id="exportPptxBtn" type="button" class="btn btn-sm btn-primary shadow-xs">
            <i class="fa-solid fa-file-powerpoint" aria-hidden="true"></i>
            <span data-i18n-zh="匯出 PPTX 投影片" data-i18n-en="Export PPTX Slide">匯出 PPTX 投影片</span>
          </button>
          <button id="refreshBtn" type="button" class="btn btn-sm btn-ghost bg-base-100 shadow-xs">
            <i class="fa-solid fa-rotate" aria-hidden="true"></i>
            <span data-i18n-zh="重新整理" data-i18n-en="Refresh">重新整理</span>
          </button>
        </div>
      </div>

      <div id="toolbarWrap" class="grid grid-cols-1 lg:grid-cols-2 gap-3" hidden>
        <form id="addForm" class="card bg-base-100 shadow-xs border border-base-300/60">
          <div class="card-body p-3 sm:p-3.5 flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
            <div class="flex items-center gap-2 flex-1">
              <i class="fa-solid fa-user-plus text-primary ml-1" aria-hidden="true"></i>
              <input id="memberInput" type="text" maxlength="60" class="input input-sm flex-1" placeholder="輸入新進成員姓名（例如：Lynn）" data-i18n-placeholder-zh="輸入新進成員姓名（例如：Lynn）" data-i18n-placeholder-en="New member name (e.g. Lynn)">
            </div>
            <div class="flex items-center gap-2">
              <select id="colorSelect" class="select select-sm w-32" aria-label="欄位配色">
                <option value="blue" data-i18n-zh="深藍標題" data-i18n-en="Ocean Blue">深藍標題</option>
                <option value="sky" data-i18n-zh="天藍標題" data-i18n-en="Sky Blue">天藍標題</option>
                <option value="teal" data-i18n-zh="青綠標題" data-i18n-en="Teal Green">青綠標題</option>
                <option value="indigo" data-i18n-zh="靛紫標題" data-i18n-en="Indigo">靛紫標題</option>
                <option value="amber" data-i18n-zh="琥珀標題" data-i18n-en="Amber">琥珀標題</option>
              </select>
              <button type="submit" class="btn btn-sm btn-primary">
                <i class="fa-solid fa-plus" aria-hidden="true"></i>
                <span data-i18n-zh="新增成員" data-i18n-en="Add member">新增成員</span>
              </button>
            </div>
          </div>
        </form>

        <form id="addMilestoneForm" class="card bg-base-100 shadow-xs border border-base-300/60">
          <div class="card-body p-3 sm:p-3.5 flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
            <div class="flex items-center gap-2 flex-1">
              <i class="fa-solid fa-flag-checkered text-primary ml-1" aria-hidden="true"></i>
              <input id="milestoneInput" type="text" maxlength="80" class="input input-sm flex-1" placeholder="輸入新里程碑名稱（例如：Mentor assigned）" data-i18n-placeholder-zh="輸入新里程碑名稱（例如：Mentor assigned）" data-i18n-placeholder-en="New milestone name (e.g. Mentor assigned)">
            </div>
            <button type="submit" class="btn btn-sm btn-secondary">
              <i class="fa-solid fa-plus" aria-hidden="true"></i>
              <span data-i18n-zh="新增里程碑" data-i18n-en="Add milestone">新增里程碑</span>
            </button>
          </div>
        </form>
      </div>

      <div id="errBox" class="mws-err" hidden></div>

      <div class="ot-board-wrap card bg-base-100 shadow-sm border border-base-300/80 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="ot-table w-full border-collapse">
            <thead id="boardHead"></thead>
            <tbody id="boardBody"></tbody>
          </table>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pt-1 text-xs text-base-content/70">
        <div class="font-semibold tracking-wider uppercase text-base-content/60" data-i18n-zh="點擊狀態膠囊可切換狀態；點擊右側日期可輸入日期或備註" data-i18n-en="Click status pill to cycle status; click date field to edit date or note">點擊狀態膠囊可切換狀態；點擊右側日期可輸入日期或備註</div>
        <div class="flex items-center gap-4 flex-wrap ml-auto">
          <span class="font-bold text-base-content/80" data-i18n-zh="圖例" data-i18n-en="Legend">圖例</span>
          <span class="inline-flex items-center gap-1.5">
            <span class="ot-dot ot-dot-completed"></span>
            <span data-i18n-zh="已完成" data-i18n-en="Completed">已完成</span>
          </span>
          <span class="inline-flex items-center gap-1.5">
            <span class="ot-dot ot-dot-in_progress"></span>
            <span data-i18n-zh="進行中" data-i18n-en="In progress">進行中</span>
          </span>
          <span class="inline-flex items-center gap-1.5">
            <span class="ot-dot ot-dot-pending"></span>
            <span data-i18n-zh="待處理" data-i18n-en="Pending">待處理</span>
          </span>
        </div>
      </div>
    </section>
  </div>
  <!-- ═══ 擴充區結束 ═══ -->
</main>
<dialog id="adminOverlay" class="modal">
  <div class="modal-box max-w-3xl">
    <h3 class="text-lg font-semibold mb-4">成員管理</h3>
    <div id="adminRoot"></div>
    <div class="modal-action">
      <button id="adminClose" type="button" class="btn btn-ghost">關閉</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button aria-label="關閉">關閉</button></form>
</dialog>
</body>
</html>
